name: Validar paquete

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install
        env:
          BOOLEAN_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build
